<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Web Potions popup (dev)</title>
  </head>
  <body>
    <script>
      // Loads the real popup with chrome.* mocked, as if opened on a Reddit page.
      // ?setup=1 shows the "Allow User Scripts" step, ?empty=1 starts with no potions.
      const params = new URLSearchParams(location.search);
      window.WP_DEV_URL = 'https://www.reddit.com/r/programming/';
      window.WP_DEV_NO_USERSCRIPTS = params.has('setup');

      // Seed a shelf of potions once.
      const KEY = 'wp-dev-storage';
      const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (!saved.potions?.length && !params.has('empty')) {
        const mk = (name, sites, extra = {}, i = 0) => ({ id: `pdev${String(i).padStart(8, '0')}`, name, sites, enabled: true, ingredients: [], css: '', js: '', repeat: 0, delay: 0, world: 'USER_SCRIPT', ...extra });
        saved.potions = [
          ['Reddit unlock', ['*.reddit.com/*'], { ingredients: [{ type: 'unwall' }] }],
          ['Reddit spice 2.0', ['reddit.com/r/*'], { enabled: false }],
          ['YouTube calm', ['*.youtube.com/*']],
          ['Medium free read', ['*.medium.com/*']],
          ['No Shorts', ['*.youtube.com/shorts/*']],
          ['Twitter focus', ['*.x.com/*', '*.twitter.com/*']],
          ['HN glow: Rust, AI', ['news.ycombinator.com/*']],
          ['LinkedIn quiet', ['*.linkedin.com/*']],
          ['Instagram no wall', ['*.instagram.com/*']],
          ['Wiki wide', ['*.wikipedia.org/*']],
          ['Image veil everywhere', []],
        ].map(([name, sites, extra], i) => ({ ...mk(name, sites, extra, i), createdAt: Date.now() - i * 60000, updatedAt: Date.now() - i * 60000 }));
        localStorage.setItem(KEY, JSON.stringify(saved));
      }
    </script>
    <script src="chrome-mock.js"></script>
    <script>
      const frame = '<style>html { background: #d9d4e6; } body { margin: 24px auto; box-shadow: 0 8px 30px rgba(34, 22, 58, .25); max-height: 600px; overflow: auto; }</style>';
      fetch('/extension/popup/popup.html', { cache: 'no-store' })
        .then((r) => r.text())
        .then((html) => {
          document.open();
          document.write(html.replace(/(src|href)="(?!#|https?:|\/)([^"]+)"/g, (m, attr, path) => `${attr}="${new URL(path, location.origin + '/extension/popup/').pathname}"`).replace('</head>', `${frame}</head>`));
          document.close();
        });
    </script>
  </body>
</html>
