<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Web Potions options (dev)</title>
  </head>
  <body>
    <script>
      // Loads the real options page with chrome.* mocked and the catalog from this repo.
      window.WP_CATALOG_URL = new URLSearchParams(location.search).has('offline') ? '/nowhere.json' : '/potions/catalog.json';
    </script>
    <script src="chrome-mock.js"></script>
    <script>
      fetch('/extension/options/options.html', { cache: 'no-store' })
        .then((r) => r.text())
        .then((html) => {
          document.open();
          document.write(html.replace(/(src|href)="(?!#|https?:|\/)([^"]+)"/g, (m, attr, path) => `${attr}="${new URL(path, location.origin + '/extension/options/').pathname}"`));
          document.close();
        });
    </script>
  </body>
</html>
