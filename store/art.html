<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store images (source of store/images)</title>
    <!-- One picture per ?shot=. Run store/render.sh to export them all. -->
    <style>
      @font-face { font-family: 'WP Pixelify'; src: url('/extension/fonts/pixelify-sans.woff2') format('woff2'); font-weight: 400 700; font-display: block; }
      * { box-sizing: border-box; margin: 0; }
      html, body { overflow: hidden; background: #FAFAF8; }
      .shot { position: relative; overflow: hidden; color: #000; font-variant-ligatures: none; -webkit-font-smoothing: antialiased; }
      .shot > canvas { position: absolute; inset: 0; }
      .words { position: absolute; top: 0; bottom: 0; left: 88px; display: flex; flex-direction: column; justify-content: center; }
      h1 { font: 500 80px/1.05 'Helvetica Neue', Helvetica, sans-serif; letter-spacing: -.028em; }
      p { margin-top: 26px; font: 31px/1.3 'Helvetica Neue', Helvetica, sans-serif; letter-spacing: -.01em; }
      .art { position: absolute; }
      .art svg { display: block; }
      iframe { display: block; border: 0; transform-origin: 0 0; }
    </style>
  </head>
  <body>
    <script src="/extension/lib/pixels.js"></script>
    <script>
      const { sprites, svg } = WP.pixels;

      const HUE = {
        purple: { rgb: [150, 40, 255], css: '150, 40, 255' },
        rose: { rgb: [255, 58, 158], css: '255, 58, 158' },
        green: { rgb: [28, 224, 118], css: '28, 224, 118' },
      };
      const PAPER = [250, 250, 248];

      // A soft bloom, with a little noise so the gradient never shows bands.
      function bloom(canvas, width, height, hue, lobes) {
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const image = ctx.createImageData(width, height);
        let seed = 11;
        const noise = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed / 2147483647 - 0.5) * 2.4;
        };
        for (let y = 0, i = 0; y < height; y++) {
          for (let x = 0; x < width; x++, i += 4) {
            let a = 0;
            for (const l of lobes) {
              const dx = (x - l.x) / l.rx;
              const dy = (y - l.y) / l.ry;
              a += l.k * Math.exp(-(dx * dx + dy * dy));
            }
            a = Math.min(1, a);
            for (let c = 0; c < 3; c++) image.data[i + c] = PAPER[c] * (1 - a) + hue.rgb[c] * a + noise();
            image.data[i + 3] = 255;
          }
        }
        ctx.putImageData(image, 0, 0);
      }
      // A tight bright center inside a wide soft halo.
      const halo = (x, y, r, strength = 1) => [
        { x, y, rx: r * 0.55, ry: r * 0.55, k: 0.52 * strength },
        { x, y, rx: r, ry: r, k: 0.34 * strength },
      ];

      // --- illustrations ------------------------------------------------------------------

      function sprite(name, scale, hue, cx, cy) {
        const rows = sprites[name];
        const el = document.createElement('div');
        el.className = 'art';
        el.style.left = `${cx - (rows[0].length * scale) / 2}px`;
        el.style.top = `${cy - (rows.length * scale) / 2}px`;
        el.style.filter = `drop-shadow(0 0 14px rgba(${hue.css}, .75))`;
        el.append(svg(name, scale));
        return el;
      }

      function frame(src, { left, top, width, height, scale, hue }) {
        const el = document.createElement('div');
        el.className = 'art';
        Object.assign(el.style, {
          left: `${left}px`,
          top: `${top}px`,
          width: `${width * scale}px`,
          height: `${height * scale}px`,
          boxShadow: `0 0 0 2px #22163A, 0 0 44px rgba(${hue.css}, .55)`,
        });
        const iframe = document.createElement('iframe');
        Object.assign(iframe, { src, width, height });
        iframe.style.transform = `scale(${scale})`;
        setInterval(() => {
          const page = iframe.contentDocument;
          page?.querySelector('.spotted')?.remove();
          page?.querySelector('input:focus')?.blur();
        }, 50);
        el.append(iframe);
        return el;
      }

      function shelf() {
        const at = Date.now();
        const mk = (name, sites, i, enabled = true) => ({ id: `pdev${String(i).padStart(8, '0')}`, name, sites, enabled, ingredients: [], css: '', js: '', repeat: 0, delay: 0, world: 'USER_SCRIPT', createdAt: at - i * 60000, updatedAt: at - i * 60000 });
        const potions = [
          ['Night mode', ['*.wiki.example/*']],
          ['Hype detector', ['*.news.example/*']],
          ['Gray mode', []],
          ['No pop-ups', ['*.dailyscroll.example/*']],
          ['Bigger text', ['*.dailyscroll.example/*'], false],
        ].map(([name, sites, enabled], i) => mk(name, sites, i, enabled));
        localStorage.setItem('wp-dev-storage', JSON.stringify({ potions }));
      }

      // --- the pictures -------------------------------------------------------------------

      const SHOTS = {
        '1-tagline': {
          hue: 'purple',
          title: 'Make the web<br>how YOU want<br>it to be',
          glow: halo(960, 400, 215),
          art: (hue) => sprite('bigWand', 11, hue, 960, 400),
        },
        '2-hide': {
          hue: 'rose',
          title: 'Hide what<br>bugs you',
          line: 'Click anything on a page<br>and it stays gone.',
          glow: halo(900, 400, 330),
          art: (hue) => frame('art-hide.html', { left: 580, top: 91, width: 400, height: 386, scale: 1.6, hue }),
        },
        '3-ai': {
          hue: 'green',
          title: 'Ask your AI<br>to make it so',
          line: 'It tries the change, checks<br>it works, and saves it.',
          glow: halo(965, 400, 240),
          art: (hue) => sprite('mirror', 14, hue, 965, 400),
        },
        '4-switches': {
          hue: 'purple',
          title: 'Everything<br>you save<br>has a switch',
          line: 'Each one runs by itself<br>on the sites you choose.',
          glow: halo(928, 430, 320),
          art: (hue) => {
            shelf();
            const url = encodeURIComponent('https://www.dailyscroll.example/');
            return frame(`/dev/popup.html?bare=1&url=${url}`, { left: 640, top: 112, width: 360, height: 460, scale: 1.6, hue });
          },
        },
        '5-free': {
          hue: 'rose',
          title: 'Free.<br>Open source.<br>No account.<br>No tracking.',
          glow: halo(965, 400, 205),
          art: (hue) => sprite('potion', 25, hue, 965, 400),
        },
        'tile-small': {
          width: 440,
          height: 280,
          hue: 'green',
          glow: halo(220, 140, 130, 1.25),
          art: (hue) => sprite('potion', 12, hue, 220, 140),
        },
        'tile-marquee': {
          width: 1400,
          height: 560,
          hue: 'purple',
          glow: halo(700, 280, 300, 1.2),
          art: (hue) => sprite('bigWand', 9, hue, 700, 280),
        },
      };

      const shot = SHOTS[new URLSearchParams(location.search).get('shot')] || SHOTS['1-tagline'];
      const width = shot.width || 1280;
      const height = shot.height || 800;
      const hue = HUE[shot.hue];
      const root = document.createElement('div');
      root.className = 'shot';
      root.style.width = `${width}px`;
      root.style.height = `${height}px`;
      const canvas = document.createElement('canvas');
      bloom(canvas, width, height, hue, shot.glow);
      root.append(canvas, shot.art(hue));
      if (shot.title) {
        const words = document.createElement('div');
        words.className = 'words';
        words.innerHTML = `<h1>${shot.title}</h1>${shot.line ? `<p>${shot.line}</p>` : ''}`;
        root.append(words);
      }
      document.body.append(root);
    </script>
  </body>
</html>
